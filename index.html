<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>קביעת תור למספרה</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1057/1057369.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Heebo', sans-serif; background-color: #09090b; color: #f4f4f5; -webkit-tap-highlight-color: transparent; }
    .custom-scroll::-webkit-scrollbar { width: 5px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-amber-500 flex items-center justify-center text-zinc-950 font-black text-lg">✂</div>
        <div>
          <h1 class="text-lg font-black text-white leading-tight">המספרה</h1>
          <p class="text-[11px] text-zinc-400">קביעת תורים אונליין</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="installBtn" class="hidden bg-zinc-800 hover:bg-zinc-700 text-amber-400 text-xs font-bold px-3 py-2 rounded-xl border border-amber-500/30">
          התקן אפליקציה 📲
        </button>
        <button onclick="toggleSidebar(true)" class="bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold text-xs sm:text-sm px-3.5 py-2 rounded-xl flex items-center gap-1.5 shadow-lg shadow-amber-500/10">
          <span>התורים שלי</span>
          <span id="myCountBadge" class="bg-zinc-950 text-amber-400 text-xs px-1.5 py-0.5 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Loading Overlay -->
  <div id="loader" class="fixed inset-0 bg-zinc-950/90 z-50 flex flex-col items-center justify-center gap-3">
    <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-sm text-zinc-400">טוען יומן תורים...</p>
  </div>

  <!-- Main Content -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-12 gap-6">
    <!-- Calendar -->
    <section class="md:col-span-7 bg-zinc-900 border border-zinc-800 rounded-2xl p-4 sm:p-5 shadow-xl h-fit">
      <div class="flex items-center justify-between mb-4">
        <h2 id="monthTitle" class="text-lg font-bold text-white"></h2>
        <div class="flex gap-1.5">
          <button onclick="changeMonth(-1)" class="w-9 h-9 rounded-lg bg-zinc-800 hover:bg-zinc-700 flex items-center justify-center text-zinc-300">❯</button>
          <button onclick="changeMonth(1)" class="w-9 h-9 rounded-lg bg-zinc-800 hover:bg-zinc-700 flex items-center justify-center text-zinc-300">❮</button>
        </div>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center text-xs font-medium text-zinc-400 mb-2">
        <div>א'</div><div>ב'</div><div>ג'</div><div>ד'</div><div>ה'</div><div>ו'</div><div class="text-rose-400">ש'</div>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 gap-1.5"></div>
    </section>

    <!-- Time Slots -->
    <section class="md:col-span-5 bg-zinc-900 border border-zinc-800 rounded-2xl p-4 sm:p-5 shadow-xl flex flex-col">
      <div class="mb-4 pb-3 border-b border-zinc-800">
        <span class="text-xs text-amber-500 font-semibold">שעות פנויות לתאריך</span>
        <h3 id="selectedDateLabel" class="text-lg font-bold text-white mt-0.5">בחר יום ביומן</h3>
      </div>
      <div id="slotsContainer" class="flex-1"></div>
    </section>
  </main>

  <!-- Booking Modal -->
  <div id="bookingModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-40 hidden items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold text-white">קביעת תור</h3>
        <button onclick="closeBookingModal()" class="text-zinc-400 hover:text-white text-xl">✕</button>
      </div>
      <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-3 mb-5 flex items-center justify-between">
        <div>
          <p class="text-xs text-zinc-400">מועד נבחר</p>
          <p id="modalDateTime" class="text-sm font-bold text-amber-400 mt-0.5"></p>
        </div>
        <span class="text-2xl">✂</span>
      </div>
      <form id="bookingForm" onsubmit="submitBooking(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-zinc-300 mb-1">שם פרטי *</label>
          <input type="text" id="firstName" required placeholder="לדוגמה: עומר" class="w-full bg-zinc-950 border border-zinc-700 focus:border-amber-500 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-300 mb-1">שם משפחה *</label>
          <input type="text" id="lastName" required placeholder="לדוגמה: כהן" class="w-full bg-zinc-950 border border-zinc-700 focus:border-amber-500 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-300 mb-1">מספר טלפון נייד (10 ספרות) *</label>
          <input type="tel" id="phone" required placeholder="0500000000" class="w-full bg-zinc-950 border border-zinc-700 focus:border-amber-500 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none text-left" dir="ltr">
        </div>
        <button type="submit" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold py-3 rounded-xl text-sm transition">
          אישור וקביעת תור
        </button>
      </form>
    </div>
  </div>

  <!-- Confirmation Code Modal -->
  <div id="codeModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-zinc-900 border border-emerald-500/40 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
      <div class="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl mx-auto mb-3">✓</div>
      <h3 class="text-xl font-black text-white">התור נקבע בהצלחה!</h3>
      <p class="text-xs text-zinc-400 mt-2">שמור את קוד הביטול האישי שלך למקרה שתרצה לבטל ממכשיר אחר:</p>
      <div id="generatedCancelCode" class="my-4 bg-zinc-950 border border-zinc-700 rounded-xl py-3 text-2xl font-black tracking-widest text-amber-400"></div>
      <button onclick="document.getElementById('codeModal').classList.add('hidden'); document.getElementById('codeModal').classList.remove('flex');" class="w-full bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold py-2.5 rounded-xl text-sm">
        הבנתי, תודה
      </button>
    </div>
  </div>

  <!-- Sidebar My Appointments -->
  <div id="sidebarOverlay" onclick="toggleSidebar(false)" class="fixed inset-0 bg-black/70 backdrop-blur-xs z-40 hidden"></div>
  <aside id="sidebar" class="fixed top-0 left-0 h-full w-full max-w-sm bg-zinc-900 border-r border-zinc-800 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col">
    <div class="p-5 border-b border-zinc-800 flex items-center justify-between">
      <h3 class="text-lg font-bold text-white">התורים שלי</h3>
      <button onclick="toggleSidebar(false)" class="w-8 h-8 rounded-lg bg-zinc-800 text-zinc-300 flex items-center justify-center">✕</button>
    </div>
    <div class="p-4 bg-zinc-950/60 border-b border-zinc-800">
      <label class="block text-xs text-zinc-400 mb-1.5">איתור תור ממכשיר אחר (הקלד מספר מלא - 10 ספרות):</label>
      <input type="tel" id="searchPhoneInput" oninput="renderMyAppointments()" placeholder="0500000000" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-white outline-none text-left" dir="ltr">
    </div>
    <div id="myAppointmentsList" class="flex-1 overflow-y-auto custom-scroll p-4 space-y-3"></div>
  </aside>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 left-5 sm:left-auto sm:w-80 bg-zinc-800 border border-amber-500/40 text-white px-4 py-3 rounded-xl shadow-2xl text-sm font-medium transform translate-y-24 opacity-0 transition-all duration-300 z-50 text-center"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, collection, addDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCN3-QXjz-6u8ynxjN8END8kEKuxXBF43U",
      authDomain: "saparot-51229.firebaseapp.com",
      projectId: "saparot-51229",
      storageBucket: "saparot-51229.firebasestorage.app",
      messagingSenderId: "421595658226",
      appId: "1:421595658226:web:840b3f1c4920766bb51d6b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let settings = {
      activeDays: [0, 1, 2, 3, 4, 5],
      startTime: "15:00",
      endTime: "20:00",
      interval: 45,
      blockedDates: [],
      blockedSlots: []
    };
    let appointments = [];
    let currentMonth = new Date();
    currentMonth.setDate(1);
    let selectedDateStr = formatDate(new Date());
    let pendingSlot = null;
    let myLocalIds = JSON.parse(localStorage.getItem('barber_my_ids') || '[]');

    const monthsHe = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
    const daysHe = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];

    function formatDate(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('translate-y-24', 'opacity-0');
      setTimeout(() => t.classList.add('translate-y-24', 'opacity-0'), 3200);
    }

    onSnapshot(doc(db, "config", "settings"), (snap) => {
      if (snap.exists()) {
        settings = { ...settings, ...snap.data() };
      }
      renderCalendar();
      renderSlots();
      document.getElementById('loader').classList.add('hidden');
    });

    onSnapshot(collection(db, "appointments"), (snapshot) => {
      appointments = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderCalendar();
      renderSlots();
      renderMyAppointments();
    });

    function generateTimeSlots() {
      const [startH, startM] = settings.startTime.split(':').map(Number);
      const [endH, endM] = settings.endTime.split(':').map(Number);
      let current = startH * 60 + startM;
      const end = endH * 60 + endM;
      const step = Number(settings.interval) || 45;
      const slots = [];
      while (current + step <= end) {
        const h = String(Math.floor(current / 60)).padStart(2, '0');
        const m = String(current % 60).padStart(2, '0');
        slots.push(`${h}:${m}`);
        current += step;
      }
      return slots;
    }

    function isDayOpen(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      if (d < today) return false;
      if (!settings.activeDays.includes(d.getDay())) return false;
      if (settings.blockedDates && settings.blockedDates.includes(dateStr)) return false;
      return true;
    }

    window.renderCalendar = function() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      document.getElementById('monthTitle').textContent = `${monthsHe[month]} ${year}`;
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const firstDayIndex = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDayIndex; i++) {
        grid.innerHTML += `<div></div>`;
      }

      const allSlots = generateTimeSlots();

      for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(year, month, day);
        const dateStr = formatDate(dateObj);
        const open = isDayOpen(dateStr);
        const isSelected = dateStr === selectedDateStr;

        const takenCount = appointments.filter(a => a.date === dateStr).length;
        const blockedCount = (settings.blockedSlots || []).filter(s => s.startsWith(dateStr + '_')).length;
        const availableCount = Math.max(0, allSlots.length - takenCount - blockedCount);

        const btn = document.createElement('button');
        btn.className = `aspect-square rounded-xl flex flex-col items-center justify-center relative transition border ${
          isSelected
            ? 'bg-amber-500 text-zinc-950 border-amber-400 font-black shadow-lg shadow-amber-500/20'
            : open && availableCount > 0
              ? 'bg-zinc-950 border-zinc-800 hover:border-amber-500/60 text-white'
              : 'bg-zinc-950/30 border-transparent text-zinc-600 cursor-not-allowed'
        }`;

        btn.innerHTML = `<span class="text-sm">${day}</span>`;
        if (open && availableCount > 0) {
          btn.innerHTML += `<span class="text-[9px] mt-0.5 ${isSelected ? 'text-zinc-900 font-bold' : 'text-emerald-400'}">${availableCount} פנויים</span>`;
        }

        if (open) {
          btn.onclick = () => {
            selectedDateStr = dateStr;
            renderCalendar();
            renderSlots();
          };
        }
        grid.appendChild(btn);
      }
    };

    window.changeMonth = function(delta) {
      currentMonth.setMonth(currentMonth.getMonth() + delta);
      renderCalendar();
    };

    window.renderSlots = function() {
      const container = document.getElementById('slotsContainer');
      const label = document.getElementById('selectedDateLabel');
      const d = new Date(selectedDateStr + 'T00:00:00');
      label.textContent = `יום ${daysHe[d.getDay()]}, ${d.getDate()} ב${monthsHe[d.getMonth()]}`;

      if (!isDayOpen(selectedDateStr)) {
        container.innerHTML = `<div class="text-center py-10 text-zinc-500 text-sm">המספרה סגורה בתאריך זה</div>`;
        return;
      }

      const slots = generateTimeSlots();
      const now = new Date();
      const todayStr = formatDate(now);
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      let html = `<div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">`;
      let hasAvailable = false;

      slots.forEach(time => {
        const [h, m] = time.split(':').map(Number);
        const isPast = selectedDateStr === todayStr && (h * 60 + m) <= currentMinutes;
        const isBooked = appointments.some(a => a.date === selectedDateStr && a.time === time);
        const isBlocked = (settings.blockedSlots || []).includes(`${selectedDateStr}_${time}`);

        if (isPast || isBooked || isBlocked) {
          html += `<div class="py-3 rounded-xl bg-zinc-950/50 border border-zinc-800/60 text-zinc-600 text-center text-sm line-through">${time}</div>`;
        } else {
          hasAvailable = true;
          html += `<button onclick="openBookingModal('${time}')" class="py-3 rounded-xl bg-zinc-950 hover:bg-amber-500 hover:text-zinc-950 border border-zinc-700 hover:border-amber-400 text-white font-bold text-sm transition shadow-xs">${time}</button>`;
        }
      });

      html += `</div>`;
      if (!hasAvailable) {
        container.innerHTML = `<div class="text-center py-10 text-zinc-500 text-sm">אין שעות פנויות שנותרו ביום זה</div>`;
      } else {
        container.innerHTML = html;
      }
    };

    window.openBookingModal = function(time) {
      pendingSlot = time;
      const d = new Date(selectedDateStr + 'T00:00:00');
      document.getElementById('modalDateTime').textContent = `יום ${daysHe[d.getDay()]}, ${d.getDate()}/${d.getMonth() + 1} בשעה ${time}`;
      document.getElementById('bookingModal').classList.remove('hidden');
      document.getElementById('bookingModal').classList.add('flex');
    };

    window.closeBookingModal = function() {
      document.getElementById('bookingModal').classList.add('hidden');
      document.getElementById('bookingModal').classList.remove('flex');
    };

    window.submitBooking = async function(e) {
      e.preventDefault();
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const cleanPhone = phone.replace(/\D/g, '');

      if (!firstName || !lastName || cleanPhone.length !== 10) {
        showToast("נא למלא שם מלא ומספר טלפון תקין בן 10 ספרות");
        return;
      }

      if (appointments.some(a => a.date === selectedDateStr && a.time === pendingSlot)) {
        showToast("אופס! מישהו בדיוק תפס את השעה הזו");
        closeBookingModal();
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = "שומר תור...";
      const cancelCode = String(Math.floor(1000 + Math.random() * 9000));

      try {
        const docRef = await addDoc(collection(db, "appointments"), {
          date: selectedDateStr,
          time: pendingSlot,
          firstName,
          lastName,
          phone,
          cancelCode,
          createdAt: Date.now()
        });
        myLocalIds.push(docRef.id);
        localStorage.setItem('barber_my_ids', JSON.stringify(myLocalIds));
        closeBookingModal();
        document.getElementById('bookingForm').reset();
        document.getElementById('generatedCancelCode').textContent = cancelCode;
        document.getElementById('codeModal').classList.remove('hidden');
        document.getElementById('codeModal').classList.add('flex');
      } catch (err) {
        showToast("שגיאה בשמירת התור, בדוק חיבור");
      } finally {
        btn.disabled = false;
        btn.textContent = "אישור וקביעת תור";
      }
    };

    window.toggleSidebar = function(open) {
      const sb = document.getElementById('sidebar');
      const ov = document.getElementById('sidebarOverlay');
      if (open) {
        document.getElementById('searchPhoneInput').value = '';
        renderMyAppointments();
        sb.classList.remove('-translate-x-full');
        ov.classList.remove('hidden');
      } else {
        sb.classList.add('-translate-x-full');
        ov.classList.add('hidden');
      }
    };

    window.renderMyAppointments = function() {
      const searchPhone = document.getElementById('searchPhoneInput').value.replace(/\D/g, '');
      const mine = appointments.filter(a => {
        const isThisDevice = myLocalIds.includes(a.id);
        const cleanPhone = (a.phone || '').replace(/\D/g, '');
        const isExactPhoneMatch = searchPhone.length === 10 && cleanPhone === searchPhone;
        return isThisDevice || isExactPhoneMatch;
      }).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

      const localOnlyCount = appointments.filter(a => myLocalIds.includes(a.id)).length;
      document.getElementById('myCountBadge').textContent = localOnlyCount;
      const list = document.getElementById('myAppointmentsList');

      if (mine.length === 0) {
        list.innerHTML = `<p class="text-center text-zinc-500 text-sm py-8">לא נמצאו תורים פעילים עבור מכשיר זה</p>`;
        return;
      }

      list.innerHTML = mine.map(app => {
        const d = new Date(app.date + 'T00:00:00');
        const isThisDevice = myLocalIds.includes(app.id);
        return `
          <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-3.5 flex items-center justify-between">
            <div>
              <p class="text-sm font-bold text-amber-400">יום ${daysHe[d.getDay()]}, ${d.getDate()}/${d.getMonth() + 1} | ${app.time}</p>
              <p class="text-xs text-zinc-300 mt-1">${app.firstName} ${app.lastName}</p>
              ${isThisDevice && app.cancelCode ? `<p class="text-[11px] text-emerald-400 mt-0.5">קוד ביטול אישי: <b>${app.cancelCode}</b></p>` : ''}
            </div>
            <button onclick="cancelMyAppointment('${app.id}', ${isThisDevice})" class="bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white border border-rose-500/30 text-xs font-bold px-3 py-2 rounded-lg transition">
              ביטול תור
            </button>
          </div>
        `;
      }).join('');
    };

    window.cancelMyAppointment = async function(id, isThisDevice) {
      const targetApp = appointments.find(a => a.id === id);
      if (!targetApp) return;

      if (!isThisDevice && targetApp.cancelCode) {
        const enteredCode = prompt("לביטול תור ממכשיר אחר, הזן את קוד הביטול בן 4 הספרות שקיבלת בקביעת התור:");
        if (enteredCode !== targetApp.cancelCode) {
          showToast("קוד ביטול שגוי! לא ניתן לבטל תור זה");
          return;
        }
      } else {
        if (!confirm("בטוח שברצונך לבטל את התור?")) return;
      }

      try {
        await deleteDoc(doc(db, "appointments", id));
        showToast("התור בוטל בהצלחה");
      } catch (e) {
        showToast("שגיאה בביטול התור");
      }
    };

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('installBtn');
      btn.classList.remove('hidden');
      btn.onclick = async () => {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        btn.classList.add('hidden');
      };
    });
  </script>
</body>
</html>
